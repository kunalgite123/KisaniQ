<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b5e20"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#388e3c"/>
      <stop offset="50%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="scald" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#fff59d"/>
      <stop offset="100%" stop-color="#ffee58"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <!-- Leaf Blade -->
  <path d="M 60 380 Q 200 40 340 380 Z" fill="url(#leaf)"/>
  <path d="M 200 40 L 200 380" stroke="#1b5e20" stroke-width="4"/>
  <!-- White/Yellow Pencil-Line Scald Stripes -->
  <path d="M 130 380 Q 180 180 185 80" stroke="url(#scald)" stroke-width="9" fill="none" stroke-linecap="round"/>
  <path d="M 155 380 Q 190 220 192 110" stroke="#ffffff" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M 245 380 Q 215 200 210 90" stroke="url(#scald)" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M 270 380 Q 230 240 222 130" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Necrotic Flecks -->
  <circle cx="185" cy="140" r="3" fill="#5d4037"/>
  <circle cx="212" cy="170" r="4" fill="#3e2723"/>
</svg>
