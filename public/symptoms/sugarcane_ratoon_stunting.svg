<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="stalkBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4e342e"/>
      <stop offset="30%" stop-color="#8d6e63"/>
      <stop offset="70%" stop-color="#a1887f"/>
      <stop offset="100%" stop-color="#3e2723"/>
    </linearGradient>
    <linearGradient id="pith" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d7ccc8"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="#212121"/>
  <!-- Split Stalk Exterior -->
  <rect x="80" y="30" width="240" height="340" rx="16" fill="url(#stalkBg)"/>
  <!-- Inner Cut Pith Layer -->
  <rect x="110" y="50" width="180" height="300" rx="8" fill="url(#pith)"/>
  <!-- Node Joint Bands -->
  <rect x="80" y="140" width="240" height="24" fill="#6d4c41"/>
  <rect x="80" y="250" width="240" height="24" fill="#6d4c41"/>
  <!-- Reddish Discolored Internal Vascular Dots at Nodes -->
  <circle cx="140" cy="152" r="6" fill="#c62828"/>
  <circle cx="170" cy="152" r="7" fill="#b71c1c"/>
  <circle cx="200" cy="152" r="6" fill="#d32f2f"/>
  <circle cx="230" cy="152" r="7" fill="#c62828"/>
  <circle cx="260" cy="152" r="6" fill="#b71c1c"/>

  <circle cx="140" cy="262" r="6" fill="#b71c1c"/>
  <circle cx="170" cy="262" r="7" fill="#c62828"/>
  <circle cx="200" cy="262" r="6" fill="#d32f2f"/>
  <circle cx="230" cy="262" r="7" fill="#b71c1c"/>
  <circle cx="260" cy="262" r="6" fill="#c62828"/>
</svg>
